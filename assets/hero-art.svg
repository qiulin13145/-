<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Abstract blue mountain landscape</title>
  <desc id="desc">A minimal blue mountain landscape with soft clouds and geometric research motifs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="0.62" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8d9f3"/>
      <stop offset="1" stop-color="#8faed9"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8c0e6"/>
      <stop offset="1" stop-color="#607fae"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f9cc8"/>
      <stop offset="1" stop-color="#405f8a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dfe8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="760" rx="40" fill="url(#sky)"/>
  <circle cx="930" cy="160" r="170" fill="url(#sun)"/>

  <g fill="#fff" opacity="0.9">
    <ellipse cx="280" cy="186" rx="105" ry="32"/>
    <ellipse cx="365" cy="180" rx="84" ry="25"/>
    <ellipse cx="790" cy="230" rx="120" ry="34"/>
    <ellipse cx="885" cy="221" rx="88" ry="26"/>
  </g>

  <path d="M0 560 L140 410 L240 500 L360 330 L490 488 L660 300 L790 470 L930 350 L1070 470 L1200 390 L1200 760 L0 760 Z" fill="url(#m1)" opacity="0.72"/>
  <path d="M0 625 L160 500 L255 575 L410 420 L560 585 L715 420 L875 560 L1030 440 L1200 565 L1200 760 L0 760 Z" fill="url(#m2)" opacity="0.82"/>
  <path d="M0 685 L180 570 L305 650 L455 520 L585 650 L730 520 L905 655 L1045 550 L1200 650 L1200 760 L0 760 Z" fill="url(#m3)" opacity="0.92"/>

  <g fill="none" stroke="#5678aa" stroke-width="3" opacity="0.22">
    <path d="M60 620 Q260 540 460 620 T860 610 T1160 600"/>
    <path d="M80 646 Q280 566 500 640 T930 630 T1180 620"/>
  </g>

  <g transform="translate(815 92)" fill="none" stroke="#5475ad" stroke-linecap="round">
    <path d="M0 78 C50 8 164 2 218 72" stroke-width="4" opacity="0.5"/>
    <path d="M48 112 C80 66 137 48 190 64" stroke-width="2.5" opacity="0.35"/>
    <circle cx="0" cy="78" r="8" fill="#6a8bd0" stroke="none"/>
    <circle cx="218" cy="72" r="8" fill="#8a79de" stroke="none"/>
  </g>

  <g transform="translate(70 92)" opacity="0.34" fill="none" stroke="#476aa5" stroke-width="3">
    <path d="M0 64 C54 12 105 2 148 18"/>
    <path d="M22 98 C74 52 121 44 174 56"/>
    <path d="M86 0 L122 32 L89 63 L53 31 Z"/>
  </g>

  <g opacity="0.12" filter="url(#blur)">
    <circle cx="190" cy="450" r="90" fill="#6d8fe0"/>
    <circle cx="1020" cy="520" r="110" fill="#8d77db"/>
  </g>

  <g fill="#314d76" opacity="0.36">
    <path d="M990 250 q18 -16 36 0 q-18 -6 -36 0Z"/>
    <path d="M1045 280 q14 -13 28 0 q-14 -5 -28 0Z"/>
